[workspace]
resolver = "2"
members = ["core", "tui", "installer"]
# "gui" joins this list once it's a real crate, not a work-in-progress
# scratch directory -- see the GUI feature's own commit.

[workspace.package]
version = "2.1.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/bel-wadoud/ytb-dl-tui"

# `[profile.*]` only takes effect at the workspace root -- applies to every
# member. No crate here relies on unwinding to recover from a panic (the
# TUI's terminal-restore cleanup runs from a panic *hook*, which still runs
# under abort), so this is a straightforward size/speed win everywhere.
[profile.release]
panic = "abort"
strip = true
