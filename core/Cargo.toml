[package]
name = "ytb-dl-tui-core"
version.workspace = true
edition.workspace = true
description = "Shared download/config/settings logic behind ytb_dl_tui's TUI and GUI frontends"
license-file.workspace = true
repository.workspace = true
publish = false

[lib]
name = "ytb_dl_tui_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
toml = "1.1.4"
which = "8.0.5"
