[package]
name = "ytb-dl-tui-install"
version.workspace = true
edition.workspace = true
description = "Self-contained installer for ytb_dl_tui: a GUI wizard letting you pick the TUI, the desktop GUI, or both, plus their bundled Python runtime + vendored yt-dlp, ffmpeg, and deno"
license-file.workspace = true
repository.workspace = true

[[bin]]
name = "ytb-dl-tui-install"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
flate2 = { version = "1.1.5", default-features = false, features = ["rust_backend"] }
iced = { version = "0.14.0", features = ["tokio"] }
tar = "0.4.46"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.17"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
which = "8.0.5"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target."cfg(unix)".dependencies]
lzma-rs = "0.3.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
winreg = "0.56.0"

# build.rs zips vendor/yt_dlp (relative to the workspace root) into the
# installer binary at compile time -- see build.rs and src/main.rs.
[build-dependencies]
anyhow = "1.0.104"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
