[package]
name = "ytb-dl-tui-gui"
version.workspace = true
edition.workspace = true
description = "Desktop GUI for downloading YouTube playlists and videos via yt-dlp"
license-file.workspace = true
repository.workspace = true
readme = "../README.md"

[[bin]]
name = "ytb_dl_tui_gui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
# "tokio": the core crate's process/channel plumbing (tokio::process::Command,
# tokio::spawn, tokio::sync::mpsc) needs a real tokio runtime under it --
# iced's default executor is its own thread-pool, not tokio, so this has to
# be requested explicitly.
iced = { version = "0.14.0", features = ["tokio"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.17"
ytb-dl-tui-core = { path = "../core" }
