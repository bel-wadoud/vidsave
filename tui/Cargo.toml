[package]
name = "playloader-tui"
version.workspace = true
edition.workspace = true
description = "Terminal UI for downloading YouTube playlists and videos via yt-dlp"
license-file.workspace = true
repository.workspace = true
readme = "../README.md"

[[bin]]
name = "playloader-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
tokio = { version = "1.53.1", features = ["full"] }
tui-input = "0.15.3"
playloader-core = { path = "../core" }
