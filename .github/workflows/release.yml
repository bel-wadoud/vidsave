name: Release

# Fires on version tags (v1.0.0, v1.2.3, ...). Builds the TUI, the GUI, and
# the installer wizard natively for Linux and Windows, then publishes the
# installer plus a portable bundle (both apps + bundled Python runtime +
# vendored yt-dlp, no installer/PATH changes -- ffmpeg/deno are still your
# own responsibility, or rely on PATH) as assets on a GitHub Release
# matching the tag.
#
# Asset names are stable across releases (no version in the filename) so the
# README's "latest download" links never need updating:
#   ytb-dl-tui-install-linux-x86_64          ytb-dl-tui-install-windows-x86_64.exe
#   ytb-dl-tui-portable-linux-x86_64.zip     ytb-dl-tui-portable-windows-x86_64.zip

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            exe_suffix: ""
            installer_asset: ytb-dl-tui-install-linux-x86_64
            portable_asset: ytb-dl-tui-portable-linux-x86_64.zip
          - os: windows-latest
            name: windows-x86_64
            exe_suffix: ".exe"
            installer_asset: ytb-dl-tui-install-windows-x86_64.exe
            portable_asset: ytb-dl-tui-portable-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: build ytb_dl_tui + ytb_dl_tui_gui
        run: cargo build --release -p ytb_dl_tui -p ytb-dl-tui-gui

      - name: embed app binaries for installer build
        shell: bash
        run: |
          mkdir -p installer/embed
          cp "target/release/ytb_dl_tui${{ matrix.exe_suffix }}" "installer/embed/ytb_dl_tui${{ matrix.exe_suffix }}"
          cp "target/release/ytb_dl_tui_gui${{ matrix.exe_suffix }}" "installer/embed/ytb_dl_tui_gui${{ matrix.exe_suffix }}"

      - name: build installer
        run: cargo build --release -p ytb-dl-tui-install

      - name: stage installer release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/ytb-dl-tui-install${{ matrix.exe_suffix }}" "dist/${{ matrix.installer_asset }}"

      # Runs the installer we just built into a scratch, redirected install
      # location (rather than hand-duplicating python_runtime.rs's download
      # URLs here) and zips up exactly what it produces -- app binary,
      # bundled Python runtime, vendored yt-dlp source, ffmpeg, deno -- as a
      # single "unzip anywhere, run the binary directly" bundle.
      - name: build portable bundle
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/portable_home"
          rm -rf "$scratch"
          mkdir -p "$scratch"
          installer="target/release/ytb-dl-tui-install${{ matrix.exe_suffix }}"
          # --silent: a real setup wizard window needs someone there to
          # click through it, which nothing is in this step -- runs the
          # exact same install non-interactively instead. < /dev/null out of
          # caution even so, since it's still a subprocess in a CI step.
          if [[ "${{ matrix.os }}" == windows-latest ]]; then
            LOCALAPPDATA="$scratch" "$installer" --silent < /dev/null
            bundle_dir="$scratch/Programs/ytb-dl-tui"
          else
            HOME="$scratch" "$installer" --silent < /dev/null
            bundle_dir="$scratch/.local/share/ytb-dl-tui"
          fi
          dist_zip="$(pwd)/dist/${{ matrix.portable_asset }}"
          py=python3; command -v python3 >/dev/null || py=python
          (cd "$bundle_dir" && "$py" -m zipfile -c "$dist_zip" *)

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: extract changelog section for this tag
        id: changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk -v ver="## [$version]" '
            $0 ~ "^## \\[" && found { exit }
            $0 ~ "^## \\[.*'"$version"'.*\\]" { found=1; next }
            found { print }
          ' CHANGELOG.md)"
          {
            echo "notes<<EOF"
            echo "$notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          name: ytb-dl-tui ${{ github.ref_name }}
          body: |
            ${{ steps.changelog.outputs.notes }}

            Full changelog: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          files: dist/*
          fail_on_unmatched_files: true
