name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt / clippy / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # Pure syntax -- safe before installer/embed/ exists (its build.rs
      # would otherwise refuse to run clippy/test/build below).
      - name: fmt check (workspace)
        run: cargo fmt --check

      # installer/build.rs refuses to compile without matching TUI + GUI
      # binaries already embedded, so build both first -- see
      # build-installer.sh, which does the same thing for local builds.
      - name: build ytb_dl_tui + ytb_dl_tui_gui (release)
        run: cargo build --release -p ytb_dl_tui -p ytb-dl-tui-gui

      - name: embed app binaries for installer build
        shell: bash
        run: |
          mkdir -p installer/embed
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/ytb_dl_tui.exe installer/embed/ytb_dl_tui.exe
            cp target/release/ytb_dl_tui_gui.exe installer/embed/ytb_dl_tui_gui.exe
          else
            cp target/release/ytb_dl_tui installer/embed/ytb_dl_tui
            cp target/release/ytb_dl_tui_gui installer/embed/ytb_dl_tui_gui
          fi

      - name: clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test (workspace)
        run: cargo test --workspace

      - name: build installer (release)
        run: cargo build --release -p ytb-dl-tui-install
